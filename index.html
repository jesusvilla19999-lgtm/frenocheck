<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrenoCheck</title>
<meta name="theme-color" content="#1d2420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FrenoCheck">
<style>
  html,body{margin:0;height:100%;background:#1d2420;color:#e9ece6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef0ec}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  #msg b{color:#e8b400;font-size:20px}
  #msg button{margin-top:14px;font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:#e8b400;color:#1d2420}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));font-size:12px;background:#3a2c12;color:#f0b04a;text-align:center;display:none}
</style>
</head>
<body>
<div id="msg"><div><b>FrenoCheck</b><p>Caricamento…</p></div></div>
<div id="bar"></div>
<script>
// La pagina del calcolatore arriva sempre aggiornata da Google Apps Script (?raw=1)
// e viene conservata sul telefono: senza rete si apre l'ultima versione scaricata.
var SRC='https://script.google.com/macros/s/AKfycbwKFQp2f-aDpjdmsDlbjEdt3_M36eVQX3JbeKPPsSbUto7LdubgOSSR-Cid5nHY6C1x/exec?raw=1';
var KEY='frenocheck_page', KEYT='frenocheck_page_time';
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var shown=false;
function show(html){
  var f=document.getElementById('app');
  if(!f){f=document.createElement('iframe');f.id='app';f.title='Calcolo frenatura MdO';f.setAttribute('allow','clipboard-write');document.body.appendChild(f)}
  f.srcdoc=html.replace('<base target="_top">','');document.getElementById('msg').style.display='none';shown=true;
}
function bar(t){var b=document.getElementById('bar');b.textContent=t;b.style.display=t?'block':'none'}
var cached=get(KEY);
if(cached){show(cached)}
var ctl=('AbortController' in window)?new AbortController():null;
var to=setTimeout(function(){if(ctl)ctl.abort()},12000);
fetch(SRC,ctl?{signal:ctl.signal,cache:'no-store'}:{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
  clearTimeout(to);
  if(t.indexOf('<html')<0)throw 0;
  if(t!==cached){put(KEY,t);put(KEYT,new Date().toLocaleString('it-IT'));show(t)}
  bar('');
}).catch(function(){
  clearTimeout(to);
  if(cached){bar('Senza rete: stai usando la versione salvata del '+(get(KEYT)||'—'))}
  else{document.getElementById('msg').innerHTML='<div><b>Nessuna connessione</b><p>Al primo avvio serve la rete per scaricare FrenoCheck. Poi funziona anche senza.</p><button type="button" onclick="location.reload()">Riprova</button></div>'}
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
